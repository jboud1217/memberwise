services:
  postgres:
    image: postgres:16-alpine
    container_name: memberwise-db
    environment:
      POSTGRES_USER: memberwise
      POSTGRES_PASSWORD: memberwise
      POSTGRES_DB: memberwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memberwise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
