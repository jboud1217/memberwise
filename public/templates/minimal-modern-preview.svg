<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" fill="none">
  <defs>
    <linearGradient id="hero-m" x1="0" y1="60" x2="480" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" rx="8" fill="#fafafa"/>
  <rect width="480" height="270" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Minimal Top Nav -->
  <rect width="480" height="24" rx="8 8 0 0" fill="#fafafa"/>
  <rect y="23" width="480" height="1" fill="#e5e5e5" opacity="0.6"/>
  <!-- Minimal text links only -->
  <rect x="20" y="8" width="32" height="8" rx="1" fill="#18181b" opacity="0.7"/>
  <rect x="340" y="9" width="22" height="6" rx="1" fill="#a1a1aa" opacity="0.5"/>
  <rect x="372" y="9" width="22" height="6" rx="1" fill="#a1a1aa" opacity="0.5"/>
  <rect x="404" y="9" width="22" height="6" rx="1" fill="#a1a1aa" opacity="0.5"/>
  <rect x="436" y="9" width="22" height="6" rx="1" fill="#a1a1aa" opacity="0.5"/>

  <!-- Large Hero Section (generous whitespace) -->
  <rect y="24" width="480" height="110" fill="url(#hero-m)"/>
  <!-- Single word heading, large -->
  <rect x="170" y="50" width="140" height="18" rx="3" fill="#18181b" opacity="0.85"/>
  <!-- Long subheading with breathing room -->
  <rect x="120" y="78" width="240" height="7" rx="2" fill="#71717a" opacity="0.45"/>
  <rect x="150" y="90" width="180" height="7" rx="2" fill="#71717a" opacity="0.35"/>
  <!-- Understated CTA -->
  <rect x="200" y="110" width="80" height="14" rx="7" fill="#18181b" opacity="0.1"/>
  <rect x="218" y="114" width="44" height="6" rx="1" fill="#18181b" opacity="0.6"/>

  <!-- Features Section (only 3 cards, more space) -->
  <rect y="134" width="480" height="64" fill="#ffffff"/>
  <rect x="180" y="140" width="120" height="8" rx="2" fill="#18181b" opacity="0.1"/>
  <!-- 3 spacious feature cards -->
  <rect x="36" y="154" width="126" height="36" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="0.5"/>
  <circle cx="99" cy="164" r="6" fill="#18181b" opacity="0.08"/>
  <rect x="74" y="174" width="50" height="5" rx="1" fill="#71717a" opacity="0.4"/>
  <rect x="66" y="182" width="66" height="3" rx="1" fill="#a1a1aa" opacity="0.3"/>

  <rect x="178" y="154" width="126" height="36" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="0.5"/>
  <circle cx="241" cy="164" r="6" fill="#18181b" opacity="0.08"/>
  <rect x="216" y="174" width="50" height="5" rx="1" fill="#71717a" opacity="0.4"/>
  <rect x="208" y="182" width="66" height="3" rx="1" fill="#a1a1aa" opacity="0.3"/>

  <rect x="320" y="154" width="126" height="36" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="0.5"/>
  <circle cx="383" cy="164" r="6" fill="#18181b" opacity="0.08"/>
  <rect x="358" y="174" width="50" height="5" rx="1" fill="#71717a" opacity="0.4"/>
  <rect x="350" y="182" width="66" height="3" rx="1" fill="#a1a1aa" opacity="0.3"/>

  <!-- Subtle CTA Section -->
  <rect y="198" width="480" height="42" fill="#18181b"/>
  <rect x="180" y="208" width="120" height="8" rx="2" fill="#ffffff" opacity="0.85"/>
  <rect x="195" y="222" width="90" height="5" rx="1" fill="#ffffff" opacity="0.35"/>
  <rect x="212" y="232" width="56" height="9" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="222" y="234" width="36" height="5" rx="1" fill="#ffffff" opacity="0.7"/>

  <!-- Generous Footer -->
  <rect y="240" width="480" height="30" rx="0 0 8 8" fill="#fafafa"/>
  <rect y="240" width="480" height="1" fill="#e5e5e5" opacity="0.4"/>
  <rect x="210" y="252" width="60" height="4" rx="1" fill="#a1a1aa" opacity="0.25"/>
</svg>